site_name: Fishing Toolkit
site_url: https://fish.ryanheavican.com/
site_description: "A personal field guide to fly fishing the Eastern Sierra: spots, species, techniques, and gear"
site_author: Ryan Heavican
repo_url: https://github.com/EvolvingSysadmin/Fishing-Toolkit
repo_name: EvolvingSysadmin/Fishing-Toolkit
edit_uri: edit/main/docs/
copyright: Copyright &copy; Ryan Heavican

theme:
  name: material
  logo: img/icon.png
  favicon: img/icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Spots:
      - spots/index.md
      - Big Pine: spots/big-pine.md
      - Bishop: spots/bishop.md
      - Bishop Backcountry: spots/bishop-backcountry.md
      - Bridgeport: spots/bridgeport.md
      - Convict Creek: spots/convict-creek.md
      - Crowley: spots/crowley.md
      - Hot Creek: spots/hot-creek.md
      - Independence: spots/independence.md
      - June Lake: spots/june-lake.md
      - Lee Vining: spots/lee-vining.md
      - Lone Pine: spots/lone-pine.md
      - Mammoth: spots/mammoth.md
      - McGee Creek: spots/mcgee-creek.md
      - Owens River: spots/owens-river.md
      - Pine Creek: spots/pine-creek.md
      - Rock Creek: spots/rock-creek.md
  - Species: species.md
  - Techniques: techniques.md
  - Hatch: hatch.md
  - Gear: gear.md
  - Reports: reports.md
  - Map: map.md
  - Resources: resources.md
